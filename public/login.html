<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DibFood Sign In</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-body">

    <main class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-header">
                <h1>DibFood</h1>
                <p class="subtitle">Sign in to order delicious food</p>
            </div>

            <form class="login-form" action="#" method="post">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email" required />
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required />
                </div>

                <div class="form-options">
                    <label class="remember">
            <input type="checkbox" name="remember" />
            Remember me
          </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">
          Sign In
        </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="#" class="signup-link">Create one</a></p>
            </div>

        </div>
    </main>

</body>

</html>
