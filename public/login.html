<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DibFood Sign In</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />

    <!-- Load only the JavaScript used by the login page. -->
    <script type="module" src="js/login.js"></script>
</head>

<body class="auth-body">

    <!-- The wrapper centers one sign-in card on the page. -->
    <main class="auth-wrapper">
        <div class="auth-card">

            <!-- Page heading shown above the sign-in form. -->
            <div class="auth-header">
                <h1>DibFood</h1>
                <p class="subtitle">Sign in to order delicious food</p>
            </div>

            <!-- This form sends credentials to the authentication backend. -->
            <!-- The id gives login.js a unique way to find this form. -->
            <form class="login-form" id="login-form" action="#" method="post">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email" maxlength="254" required />
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" minlength="8" maxlength="128" required />
                </div>

                <!-- Optional account actions displayed on one row. -->
                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" name="remember" />
                        Remember me
                    </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">
                    Sign In
                </button>
                <!-- JavaScript writes login progress and errors here. -->
                <p id="login-status" role="status" aria-live="polite"></p>
            </form>

            <!-- Account creation will be connected in the authentication phase. -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="#" class="signup-link">Create one</a></p>
            </div>

        </div>
    </main>

</body>

</html>
